name: Production Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      ADMIN_PANEL_PASSWORD: ci-admin-password-32-characters
      ADMIN_PANEL_TOKEN: ci-admin-token-64-characters-minimum-value-for-checks
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-upstash-token
      SENTRY_DSN: ""
      NEXT_PUBLIC_SITE_URL: https://example.com
      CRON_SECRET: ci-cron-secret-64-characters-minimum-value-for-open-launch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secret-scan

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Mobile typecheck
        run: npm run mobile:type-check

      - name: Build
        run: npm run build
